  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Heebo', sans-serif; background: #f4f2ec; color: #1f2a33; }
  .card { width: 1080px; height: 1350px; padding: 64px 72px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 22px; margin-top: 18px; }

  .scan { margin-top: 40px; font-size: 40px; font-weight: 600; }
  .url { margin-top: 10px; font-size: 30px; color: #4a5763; direction: ltr; unicode-bidi: isolate; }

</head>
<body>
  <div class="card">

    <div class="qr"><img src="qr-insights-hq.png" alt="קוד QR לפתיחת כירופולוגיה"></div>
    <div class="scan">סורקים את הקוד ופותחים בטלפון</div>
    <div class="url">motimarion.github.io/my-windsurf-app/insights</div>
    <div class="foot">מחקר והדגמה — לא אבחון · מיומנויות וסוגיות ב־AI לאנשי למידה · HIT</div>
  </div>
